server {
    listen 80;
    server_name _;

    location / {
        # Kiểm tra API key trong header X-API-Key
        set $api_key_valid 0;
        
        # Cho phép các API key hợp lệ (thêm nhiều key nếu cần)
        if ($http_x_api_key = "sk-searxng-4f0158d9fc0a9750d55e338fef1092f0") {
            set $api_key_valid 1;
        }
        
        # Từ chối nếu không có API key hợp lệ
        if ($api_key_valid = 0) {
            return 401 '{"error": "Unauthorized", "message": "Valid X-API-Key header required"}';
        }

        # Proxy đến SearxNG core
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme $scheme;

        # Không gửi header X-API-Key xuống SearXNG
        proxy_set_header X-API-Key "";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (không cần API key)
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Metrics endpoint (cần API key)
    location /stats {
        set $api_key_valid 0;
        
        if ($http_x_api_key = "sk-searxng-4f0158d9fc0a9750d55e338fef1092f0") {
            set $api_key_valid 1;
        }
        
        if ($api_key_valid = 0) {
            return 401 '{"error": "Unauthorized"}';
        }
        
        proxy_pass http://core:8080/stats;
    }
}