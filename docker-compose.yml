name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:latest
    restart: always
    # Chỉ expose port nội bộ, không ra ngoài
    expose:
      - 8080
    volumes:
      - ./config/:/etc/searxng/:Z
      - ./data/:/var/cache/searxng/
    networks:
      - searxng-net

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - ./valkey-data/:/data/
    networks:
      - searxng-net

  nginx:
    container_name: searxng-nginx
    image: nginx:alpine
    restart: always
    ports:
      - 8088:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core
    networks:
      - searxng-net

networks:
  searxng-net:
    driver: bridge